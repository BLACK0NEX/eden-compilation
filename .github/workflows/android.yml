name: Build Eden Optimized APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code (v4)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21 (Latest LTS)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android NDK r27c (Stable LTS)
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c

    - name: Configure Android SDK and NDK paths dynamically
      run: |
        # البحث التلقائي والديناميكي عن ملف gradlew في كامل المستودع
        export GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found in the repository!"
          exit 1
        fi
        export ANDROID_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found Android project directory at: $ANDROID_DIR"
        
        # إنشاء ملف local.properties في المسار المكتشف ديناميكياً لتوجيه المترجم
        echo "sdk.dir=$ANDROID_HOME" > "$ANDROID_DIR/local.properties"
        echo "ndk.dir=$ANDROID_NDK_HOME" >> "$ANDROID_DIR/local.properties"
        
        # حذف سطر ndkVersion الصارم لفرض التوافقية مع r27c
        find "$ANDROID_DIR" -name "build.gradle*" -exec sed -i '/ndkVersion/d' {} \;

    - name: Grant Execute Permission to Gradlew
      run: |
        export GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        chmod +x "$GRADLEW_PATH"

    - name: Build with Gradle
      run: |
        export GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        export ANDROID_DIR=$(dirname "$GRADLEW_PATH")
        cd "$ANDROID_DIR"
        ./gradlew assembleRelease

    - name: Upload APK Artifact (v4)
      uses: actions/upload-artifact@v4
      with:
        name: Eden-APK
        path: |
          **/build/outputs/apk/release/*.apk
