name: Build Eden Optimized APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code (v4)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21 (Latest LTS)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Configure Android SDK path dynamically
      run: |
        # البحث التلقائي والديناميكي عن ملف gradlew في كامل المستودع
        export GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found in the repository!"
          exit 1
        fi
        export ANDROID_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found Android project directory at: $ANDROID_DIR"
        
        # تهيئة ملف local.properties بالمسار الرئيسي للـ SDK المدمج سحابياً فقط
        echo "sdk.dir=$ANDROID_HOME" > "$ANDROID_DIR/local.properties"
        
        # إجبار جيت هاب على استخدام بروتوكول HTTPS السريع وتفادي قيود الـ SSH والـ Rate Limit للـ Submodules
        git config --global url."https://github.com/".insteadOf "git://github.com/"
        git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Grant Execute Permission to Gradlew
      run: |
        export GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        chmod +x "$GRADLEW_PATH"

    - name: Build with Gradle
      env:
        # حقن مفتاح المصادقة السحابي لتفادي حظر تحميل حزم الـ CPM والـ Shaders
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        export ANDROID_DIR=$(dirname "$GRADLEW_PATH")
        cd "$ANDROID_DIR"
        
        # إجبار نظام البناء على تجميع معمارية الهاتف arm64-v8a وتخطي أي معمارية أخرى
        ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a

    - name: Upload APK Artifact (v4)
      uses: actions/upload-artifact@v4
      with:
        name: Eden-APK
        path: |
          **/build/outputs/apk/release/*.apk
